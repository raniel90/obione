[project]
name = "obione-backend"
version = "0.1.0"
description = "ObiOne — Observatorio de Projetos. Backend FastAPI + Postgres."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.0",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
    "instructor>=1.6",
    "python-docx>=1.1",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
]

[project.scripts]
obione = "obione.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "unit: pure unit tests with no I/O",
    "integration: tests that hit the real database",
    "e2e: end-to-end tests via FastAPI TestClient",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# `atividades/` only appears inside the dev container via a bind mount
# (see docker-compose.yml). It contains academic Python helpers that
# don't follow this project's conventions; exclude from ruff scans.
extend-exclude = ["atividades"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line length — handled by formatter
    "B008",   # function call in default — FastAPI `Depends(...)` is idiomatic
    "N818",   # Exception suffix — `ObioneException` mirrors Python stdlib (RuntimeException, BaseException)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "N802",   # allow Test_ prefixes
    "B017",   # `pytest.raises(Exception)` is fine in tests
    "E702",   # `s.add(u); s.commit()` is a common test-setup idiom
]
