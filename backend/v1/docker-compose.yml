services:
  postgres:
    image: postgres:16-alpine
    container_name: obione-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-obione}
      POSTGRES_USER: ${POSTGRES_USER:-obione}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-obione}
    ports:
      - "5435:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-obione} -d ${POSTGRES_DB:-obione}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: obione-backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ../atividades:/app/atividades:ro
    command: uvicorn obione.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:22-alpine
    container_name: obione-frontend
    profiles: ["full"]
    working_dir: /app
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      backend:
        condition: service_started

volumes:
  pg_data:
  frontend_node_modules:
