server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: obione-backend

  datasource:
    url: jdbc:h2:mem:obione_dev
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Spring AI / Ollama — only used when obione.llm.provider=ollama.
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.1:8b
          temperature: 0.3

# AI assistant provider: "mock" (default, deterministic, no network — CI/demo)
# or "ollama" (real LLM via the local Ollama server above).
obione:
  llm:
    provider: mock