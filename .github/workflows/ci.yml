name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend (Java 21 · Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Runs the test phase against the in-memory H2 datasource (no external DB).
      - name: Build + test (mvnw verify)
        run: ./mvnw -B -ntp verify

  frontend:
    name: frontend (bun · TanStack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # NOTE: `bun run lint` is intentionally not gated yet — the codebase
      # (including the archived frontend/v1) is not Prettier-clean. Add a lint
      # step here once `bun run format` has been applied across the tree.
