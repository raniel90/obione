name: backend-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ruff + pytest (Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: obione
          POSTGRES_USER: obione
          POSTGRES_PASSWORD: obione
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U obione -d obione"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://obione:obione@localhost:5432/obione
      JWT_SECRET: ci-secret-must-be-at-least-32-characters-long-okay
      LLM_PROVIDER: mock
      STORAGE_ROOT: /tmp/obione-ci-storage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: pip install -e ".[dev]"
        working-directory: backend

      - name: Ruff lint
        run: ruff check .
        working-directory: backend

      - name: Ruff format check
        run: ruff format --check .
        working-directory: backend

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U obione && break
            sleep 1
          done

      - name: Run Alembic migrations
        run: alembic upgrade head
        working-directory: backend

      - name: Run pytest (unit + integration + e2e)
        run: pytest -q
        working-directory: backend
